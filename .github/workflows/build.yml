name: Build Android APK

on:
  push:
    branches: [ main, master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # Scarica il codice dal repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Installa Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installa Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Installa Flet
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # Compila l'app Android
      - name: Build Android APK
        run: |
          yes y | flet build apk --project calculator

      # Carica il file APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: build/apk/*.apk
          if-no-files-found: error
